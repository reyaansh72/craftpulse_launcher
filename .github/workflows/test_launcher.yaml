
name: CraftPulse Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Launcher Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Verify test file exists
        run: |
          if [ ! -f tests/test_launcher.py ]; then
            echo "::error::tests/test_launcher.py was not found!"
            exit 1
          fi

      - name: Run unit tests
        run: python tests/test_launcher.py

      - name: Success - Ready for Build and Release
        if: success()
        run: |
          echo "=========================================="
          echo "✅ ALL UNIT TESTS PASSED"
          echo "🚀 Ready to Run Build And Release GitHub Action"
          echo "=========================================="

      - name: Failure - Build and Release Blocked
        if: failure()
        run: |
          echo "=========================================="
          echo "❌ UNIT TESTS FAILED"
          echo "🛑 NOT READY TO BUILD AND RELEASE"
          echo "Fix the failing tests before releasing."
          echo "=========================================="
